<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Potion Merge</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120727;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Do NOT force canvas CSS size. Stretching a lower-res buffer is what
         made the whole game look soft / pixelated on desktop and HiDPI. */
      #game-container canvas {
        display: block;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
